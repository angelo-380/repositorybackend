<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anjoph Profile</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="relative min-h-screen flex items-center justify-center p-4 md:p-8 font-sans overflow-x-hidden bg-radial from-[#1b3453] via-[#0d2035] to-[#050b14] text-white">

  <!-- Orbes fluidos de fondo -->
  <div class="absolute -top-20 -left-16 w-80 h-80 bg-blue-500/25 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute top-1/3 -right-20 w-96 h-96 bg-indigo-600/20 rounded-full blur-[90px] pointer-events-none"></div>
  <div class="absolute -bottom-16 left-1/3 w-72 h-72 bg-sky-400/20 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Botón Volver a Inicio -->
  <a href="/" class="absolute top-6 left-6 z-20 flex items-center gap-2 px-4 py-2 rounded-full backdrop-blur-xl bg-white/10 border border-white/20 text-xs font-semibold tracking-wider hover:bg-white/20 transition-all text-gray-200">
    <i class="fa-solid fa-arrow-left"></i> Home
  </a>

  <!-- Tarjeta Liquid Glass -->
  <div class="relative z-10 max-w-2xl w-full rounded-3xl overflow-hidden backdrop-blur-2xl bg-white/[0.08] border border-white/30 border-t-white/60 border-l-white/50 shadow-[0_30px_70px_rgba(0,0,0,0.5),inset_0_1px_2px_rgba(255,255,255,0.7)] mt-12 md:mt-0">
    
    <!-- Header Perfil -->
    <div class="relative p-6 md:p-8 border-b border-white/15 bg-white/[0.03]">
      <div class="flex flex-col sm:flex-row items-center gap-6 md:gap-8">
        
        <!-- Avatar y Status -->
        <div class="flex flex-col items-center gap-3 shrink-0">
          <div class="w-28 h-28 md:w-36 md:h-36 rounded-full p-1 bg-gradient-to-tr from-white/70 via-sky-300/30 to-transparent shadow-xl">
            <div class="w-full h-full rounded-full overflow-hidden backdrop-blur-md bg-white/10 flex items-center justify-center border border-white/40">
              <img src="img/pfp_02.png" alt="Portrait" class="w-full h-full object-cover">
            </div>
          </div>

          <div class="bg-white/10 border border-white/30 backdrop-blur-md rounded-lg px-3 py-1 text-center w-full shadow-md">
            <p class="text-[10px] md:text-[11px] text-gray-300 font-bold uppercase tracking-widest border-b border-white/20 pb-0.5 mb-0.5">Status</p>
            <p class="text-[12px] md:text-[13px] text-gray-200 tracking-wide font-medium">Open</p>
          </div>
        </div>

        <!-- Info Principal -->
        <div class="text-white flex flex-col justify-center items-center sm:items-start min-w-0 text-center sm:text-left">
          <h1 class="text-3xl md:text-5xl font-bold tracking-widest">
            ANJOPH
          </h1>
          
          <ul class="text-gray-300 text-xs md:text-sm font-medium space-y-0.5 my-3 tracking-wide">
            <li>- Illustrator</li>
            <li>- Artist</li>
            <li>- Programmer</li>
          </ul>

          <!-- Botones interactivos con efectos hover -->
          <div class="flex gap-2 md:gap-3 mt-3">
            <a href="javascript:void(0)" 
               class="w-8 h-8 md:w-10 md:h-10 bg-white/20 border border-white/30 rounded-full flex items-center justify-center text-white hover:bg-white hover:text-[oklch(64.5%_0.246_16.439)] cursor-pointer transition transform hover:scale-110 shadow-md">
              <i class="fab fa-instagram text-base md:text-xl"></i>
            </a>

            <a href="javascript:void(0)" 
               class="w-8 h-8 md:w-10 md:h-10 bg-white/20 border border-white/30 rounded-full flex items-center justify-center text-white hover:bg-white hover:text-[oklch(62.3%_0.214_259.815)] cursor-pointer transition transform hover:scale-110 shadow-md">
              <i class="fab fa-discord text-sm md:text-lg"></i>
            </a>

            <a href="javascript:void(0)" 
               class="w-8 h-8 md:w-10 md:h-10 bg-white/20 border border-white/30 rounded-full flex items-center justify-center text-white hover:bg-white hover:text-[oklch(76.5%_0.177_163.223)] cursor-pointer transition transform hover:scale-110 shadow-md">
              <i class="fab fa-deviantart text-sm md:text-lg"></i>
            </a>
          </div>
        </div>

      </div>
    </div>

    <!-- Sección Who am I y Botones -->
    <div class="p-6 md:p-10 grid grid-cols-1 md:grid-cols-2 gap-8 items-center bg-white/[0.02]">
      
      <!-- Texto original -->
      <div class="text-center md:text-left flex flex-col items-center md:items-start">
        <h2 class="text-2xl font-bold text-white mb-3">Who am I?</h2>
        <div class="space-y-3 text-gray-300 text-xs md:text-sm leading-relaxed">
          <p>Hi! I've been into art for a while and finally I feel confident to draw for others.</p>
          <p>Feel free to ask using discord if you're still not sure to order yet.</p>
        </div>
      </div>

      <!-- Acciones: Botón de CV -->
      <div class="flex flex-col justify-center items-center md:items-end space-y-3 w-full">
        <a href="/cv" class="w-56 flex items-center justify-center gap-2 rounded-xl py-3 px-6 font-bold text-xs uppercase tracking-wider text-sky-950 bg-gradient-to-r from-sky-200 via-white to-sky-100 border border-white hover:shadow-[0_0_20px_rgba(255,255,255,0.4)] transition-all transform hover:-translate-y-0.5 active:scale-95">
          <i class="fa-solid fa-file-lines"></i>
          <span>View CV</span>
        </a>
      </div>

    </div>

  </div>

</body>
</html>
